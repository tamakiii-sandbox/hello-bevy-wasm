[package]
name = "hello-bevy-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.1", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_asset",
    "bevy_scene",
    "webgl2",
] }
wasm-bindgen = "0.2"
web-sys = "0.3"

[lib]
crate-type = ["cdylib"]